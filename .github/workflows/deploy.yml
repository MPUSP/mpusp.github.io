name: Deploy to GitHub Pages

on:
  schedule:
    - cron: 0 5 * * 5
  push:
    branches: [main]

jobs:
  generate-page:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0
        with:
          cache: true

      - name: Generate page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pixi run generate-page

      - name: Upload page data
        uses: actions/upload-artifact@v4
        with:
          name: generated-data
          path: static/data/*.json

      - name: Upload workflow data
        uses: actions/upload-artifact@v4
        with:
          name: generated-workflows
          path: docs/workflows/all_workflows/*.md

  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    needs: generate-page
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download generated data
        uses: actions/download-artifact@v4
        with:
          name: generated-data
          path: static/data/

      - name: Download generated workflows
        uses: actions/download-artifact@v4
        with:
          name: generated-workflows
          path: docs/workflows/all_workflows/

      - uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
