name: Test deployment

on:
  pull_request:
    branches: [main]

jobs:
  generate-page:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          channels: conda-forge
          environment-file: environment.yaml
          miniforge-version: latest

      - name: Generate page
        shell: bash -l {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/scripts/generate_page.py
          python src/scripts/generate_workflow_md.py

      - name: Upload page data
        uses: actions/upload-artifact@v4
        with:
          name: generated-data
          path: static/data/*.json

      - name: Upload workflow data
        uses: actions/upload-artifact@v4
        with:
          name: generated-workflows
          path: docs/workflows/all_workflows/*.md

  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    needs: generate-page
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download generated data
        uses: actions/download-artifact@v4
        with:
          name: generated-data
          path: static/data/

      - name: Download generated workflows
        uses: actions/download-artifact@v4
        with:
          name: generated-workflows
          path: docs/workflows/all_workflows/

      - uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test build website
        run: npm run build
